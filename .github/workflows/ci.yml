name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the run already in flight redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os == 'ubuntu-latest' && 'Linux' || 'Windows' }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One broken configuration should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v4

      # SDL is built from source, so its backends need their headers present.
      # SDL's CMake treats a missing dependency as a hard error rather than
      # quietly dropping the backend, so this list is not optional.
      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      # Two deliberate choices here.
      #
      # No -G on Windows: let CMake pick whichever Visual Studio the runner
      # image ships, so a runner image bump does not need a change here.
      #
      # Warnings are errors on Linux only. Both legs compile the same sources,
      # so a genuine new warning shows up on GCC anyway, and keeping MSVC's /W4
      # advisory means a warning that only Microsoft raises reports itself in
      # the log instead of failing an otherwise good build. Flip it to ON
      # everywhere once the Windows leg has been seen clean.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLABS_WERROR=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
          ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # Each lab runs for 120 frames against SDL's dummy video driver, so this
      # needs no display and still exercises init, event handling, rendering
      # and shutdown. See tests/smoke_main.c.
      - name: Smoke test (headless)
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
